spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tgapp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  bot-token: ${BOT_TOKEN:}
  jwt-secret: ${JWT_SECRET:changeme}
  cors:
    allowed-origins: "*"

tgapp:
  access:
    # Comma-separated env values also work: SELLER_TELEGRAM_IDS=1001,1002
    seller-ids: ${SELLER_TELEGRAM_IDS:1001}
    admin-ids: ${ADMIN_TELEGRAM_IDS:9001}
